spring.application.name=enterprise-risk-api
server.port=8080

# Auth0 resource-server settings. Override with environment variables in production:
#   SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_ISSUER_URI, SPRING_SECURITY_OAUTH2_RESOURCESERVER_JWT_AUDIENCES
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://YOUR_TENANT.us.auth0.com/
spring.security.oauth2.resourceserver.jwt.audiences=https://enterprise-risk-api

# Exact origins allowed by CORS (override with APP_CORS_ALLOWED_ORIGINS).
app.cors.allowed-origins=http://localhost:5173,https://YOUR-SUBDOMAIN.duckdns.org

# Only expose the health endpoint, without internal details.
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Listen only on loopback; Apache is the only public entry point.
server.address=127.0.0.1
